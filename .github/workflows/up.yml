name: Up - Infrastructure & Application Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target AWS Environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      aws_region:
        description: "AWS Region"
        required: true
        default: "il-central-1"
      skip_infra:
        description: "Skip Terraform infrastructure provisioning (run apps/manifests only)"
        type: boolean
        default: false
      skip_vpc:
        description: "Target existing VPC (skip re-applying VPC module if already exists)"
        type: boolean
        default: false
      run_smoke_tests:
        description: "Run automated architecture smoke test suite after deployment"
        type: boolean
        default: false
      run_destructive_tests:
        description: "Run destructive architecture tests (pod kills, DLQ injection)"
        type: boolean
        default: false

concurrency:
  group: up-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  HELM_VERSION: "v3.15.4"

jobs:
  infra-up:
    name: Provision Infrastructure (Terraform)
    if: ${{ !inputs.skip_infra }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    outputs:
      cluster_name: ${{ steps.tf_outputs.outputs.cluster_name }}
      aurora_endpoint: ${{ steps.tf_outputs.outputs.aurora_endpoint }}
    defaults:
      run:
        working-directory: terraform/environments/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply (Infra & Data Tier)
        run: |
          if [ "${{ github.event.inputs.skip_vpc }}" == "true" ]; then
            echo "Targeting existing VPC: applying EKS, Karpenter, DBs, SQS, and IAM..."
            terraform apply -auto-approve \
              -target=module.eks \
              -target=module.karpenter \
              -target=module.rds_aurora \
              -target=module.elasticache \
              -target=module.sqs \
              -target=module.secrets_manager \
              -target=module.iam_roles
          else
            echo "Applying full infrastructure..."
            terraform apply -auto-approve
          fi

      - name: Export Outputs
        id: tf_outputs
        run: |
          CLUSTER_NAME="online-boutique-${{ github.event.inputs.environment }}"
          if RAW_OUT=$(terraform output -raw cluster_name 2>/dev/null) && [ -n "$RAW_OUT" ] && [[ "$RAW_OUT" != *"Warning"* ]]; then
            CLUSTER_NAME="$RAW_OUT"
          fi
          echo "Using cluster name: ${CLUSTER_NAME}"
          echo "cluster_name=${CLUSTER_NAME}" >> "$GITHUB_OUTPUT"

          AURORA_ENDPOINT=""
          if RAW_AURORA=$(terraform output -raw aurora_endpoint 2>/dev/null) && [ -n "$RAW_AURORA" ] && [[ "$RAW_AURORA" != *"Warning"* ]]; then
            AURORA_ENDPOINT="$RAW_AURORA"
          fi
          echo "Using Aurora endpoint: ${AURORA_ENDPOINT}"
          echo "aurora_endpoint=${AURORA_ENDPOINT}" >> "$GITHUB_OUTPUT"

  apps-up:
    name: Deploy Core Controllers & Online Boutique (Helm)
    needs: infra-up
    if: ${{ always() && (needs.infra-up.result == 'success' || needs.infra-up.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    timeout-minutes: 60
    env:
      CLUSTER_NAME: ${{ needs.infra-up.outputs.cluster_name != '' && needs.infra-up.outputs.cluster_name || format('online-boutique-{0}', github.event.inputs.environment) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Setup Kubectl & Helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Update Kubeconfig
        run: |
          echo "Updating kubeconfig for cluster: ${CLUSTER_NAME}"
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region ${{ github.event.inputs.aws_region }}

      - name: Wait for EKS Control Plane & Nodes
        run: |
          echo "Waiting for at least one Kubernetes node to be Ready (max 10 minutes)..."
          READY_NODE=false
          for i in $(seq 1 60); do
            if kubectl get nodes -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' 2>/dev/null | grep -q "True"; then
              READY_NODE=true
              echo "Found Ready Kubernetes node(s) on attempt $i/60."
              break
            fi
            echo "Waiting for a Ready node... ($i/60)"
            sleep 10
          done

          if [ "$READY_NODE" != "true" ]; then
            echo "ERROR: Timed out waiting for at least one Ready node after 10 minutes."
            kubectl get nodes -o wide 2>/dev/null || true
            exit 1
          fi

          echo "Kubernetes nodes status:"
          kubectl get nodes -o wide

      - name: Install Karpenter Autoscaler (CRDs, Controller, NodePool)
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          KARPENTER_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/karpenter-controller-${CLUSTER_NAME}"

          echo "Authenticating Helm with Public ECR..."
          ECR_PASS=$(aws ecr-public get-login-password --region us-east-1 2>&1)
          if [ $? -eq 0 ] && [ -n "$ECR_PASS" ]; then
            echo "$ECR_PASS" | helm registry login --username AWS --password-stdin public.ecr.aws
            echo "Successfully authenticated with Public ECR."
          else
            echo "::warning::Public ECR login output: $ECR_PASS"
          fi

          echo "Applying Karpenter CRDs from repository..."
          kubectl apply -f kubernetes/crds/karpenter-crds.yaml --server-side --force-conflicts
          kubectl wait --for=condition=Established crd/nodepools.karpenter.sh crd/nodeclaims.karpenter.sh crd/ec2nodeclasses.karpenter.k8s.aws --timeout=60s

          if kubectl get deployment karpenter -n kube-system >/dev/null 2>&1 && [ "$(kubectl get deployment karpenter -n kube-system -o jsonpath='{.status.readyReplicas}')" -ge 1 ] 2>/dev/null; then
            echo "Karpenter is already installed and healthy."
          else
            echo "Installing Karpenter Controller..."
            for attempt in 1 2 3; do
              echo "Karpenter install attempt $attempt/3..."
              if helm upgrade --install karpenter oci://public.ecr.aws/karpenter/karpenter \
                --version "1.0.6" \
                --namespace kube-system \
                --create-namespace \
                --set "settings.clusterName=${CLUSTER_NAME}" \
                --set "settings.interruptionQueue=${CLUSTER_NAME}-karpenter-interruption" \
                --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${KARPENTER_ROLE_ARN}" \
                --set controller.resources.requests.cpu="200m" \
                --set controller.resources.requests.memory="256Mi" \
                --set controller.resources.limits.cpu="1" \
                --set controller.resources.limits.memory="1Gi" \
                --wait --timeout 5m; then
                echo "Karpenter controller successfully installed."
                break
              else
                if [ $attempt -eq 3 ]; then
                  echo "ERROR: Failed to install Karpenter controller after 3 attempts."
                  exit 1
                fi
                echo "Attempt $attempt failed. Retrying in 15 seconds..."
                sleep 15
              fi
            done
          fi

          echo "Applying Karpenter Default EC2NodeClass and NodePool..."
          sed -e "s/{{CLUSTER_NAME}}/${CLUSTER_NAME}/g" \
              -e "s/{{ENVIRONMENT}}/${{ github.event.inputs.environment }}/g" \
              kubernetes/karpenter/nodeclass.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/karpenter/nodepool.yaml

      - name: Install Ingress-NGINX / AWS Load Balancer Controller
        run: |
          if helm status ingress-nginx -n ingress-nginx >/dev/null 2>&1; then
            echo "ingress-nginx is already installed. Skipping reinstall."
          else
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm repo update
            helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
              --version "4.11.3" \
              --namespace ingress-nginx \
              --create-namespace \
              --set controller.service.type=LoadBalancer \
              --wait --timeout 5m
          fi

      - name: Install External Secrets Operator (ESO)
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ESO_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${CLUSTER_NAME}-external-secrets"

          echo "Checking and applying External Secrets CRDs..."
          if kubectl get crd externalsecrets.external-secrets.io -o jsonpath='{.status.storedVersions}' 2>/dev/null | grep -q 'v1"'; then
            echo "Removing incompatible v1 CRD definitions from earlier test..."
            kubectl delete crd clusterexternalsecrets.external-secrets.io clustersecretstores.external-secrets.io externalsecrets.external-secrets.io secretstores.external-secrets.io --ignore-not-found
          fi
          kubectl apply -f kubernetes/crds/external-secrets-crds.yaml --server-side --force-conflicts
          kubectl wait --for=condition=Established crd/externalsecrets.external-secrets.io crd/clustersecretstores.external-secrets.io --timeout=60s
          if helm status external-secrets -n external-secrets >/dev/null 2>&1; then
            echo "external-secrets is already installed."
          else
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update
            helm upgrade --install external-secrets external-secrets/external-secrets \
              --version "0.10.4" \
              --namespace external-secrets \
              --create-namespace \
              --set installCRDs=false \
              --set serviceAccount.name=external-secrets-sa \
              --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${ESO_ROLE_ARN}" \
              --wait --timeout 5m
          fi
          if kubectl get sa external-secrets-sa -n external-secrets >/dev/null 2>&1; then
            kubectl annotate serviceaccount external-secrets-sa -n external-secrets \
              eks.amazonaws.com/role-arn="${ESO_ROLE_ARN}" --overwrite
          fi

      - name: Install Prometheus & Grafana (kube-prometheus-stack)
        run: |
          if helm status prometheus -n monitoring >/dev/null 2>&1; then
            echo "prometheus stack is already installed."
          else
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
            helm repo update
            helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
              --version "65.8.1" \
              --namespace monitoring \
              --create-namespace \
              --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
              --set grafana.env.GF_SERVER_ROOT_URL="%(protocol)s://%(domain)s:%(http_port)s/grafana/" \
              --set grafana.env.GF_SERVER_SERVE_FROM_SUB_PATH=true \
              --wait --timeout 7m
          fi
          echo "Ensuring Grafana subpath /grafana is configured..."
          if kubectl get deployment prometheus-grafana -n monitoring >/dev/null 2>&1; then
            kubectl set env deployment/prometheus-grafana -n monitoring \
              GF_SERVER_ROOT_URL="%(protocol)s://%(domain)s:%(http_port)s/grafana/" \
              GF_SERVER_SERVE_FROM_SUB_PATH="true"
          fi

          echo "Applying YACE CloudWatch SQS Exporter..."
          sed -e "s/{{CLUSTER_NAME}}/${CLUSTER_NAME}/g" \
              -e "s/{{AWS_ACCOUNT_ID}}/${AWS_ACCOUNT_ID}/g" \
              kubernetes/monitoring/yace-sqs-exporter.yaml | kubectl apply -f -

      - name: Install ArgoCD
        run: |
          if helm status argocd -n argocd >/dev/null 2>&1; then
            echo "argocd is already installed."
          else
            helm repo add argo https://argoproj.github.io/argo-helm
            helm repo update
            helm upgrade --install argocd argo/argo-cd \
              --version "7.7.23" \
              --namespace argocd \
              --create-namespace \
              --set server.service.type=ClusterIP \
              --set "configs.params.server\.basehref=/argocd" \
              --set "configs.params.server\.rootpath=/argocd" \
              --wait --timeout 5m
          fi
          echo "Ensuring ArgoCD subpath /argocd is configured..."
          kubectl patch configmap argocd-cmd-params-cm -n argocd --type merge -p '{"data":{"server.basehref":"/argocd","server.rootpath":"/argocd"}}'
          kubectl rollout restart deployment/argocd-server -n argocd

      - name: Install Argo Rollouts Controller & Dashboard
        run: |
          if helm status argo-rollouts -n argo-rollouts >/dev/null 2>&1; then
            echo "argo-rollouts is already installed."
          else
            helm repo add argo https://argoproj.github.io/argo-helm
            helm repo update
            helm upgrade --install argo-rollouts argo/argo-rollouts \
              --version "2.38.2" \
              --namespace argo-rollouts \
              --create-namespace \
              --set dashboard.enabled=true \
              --wait --timeout 5m
          fi
          echo "Installing kubectl-argo-rollouts CLI plugin..."
          sudo curl -sSL -o /usr/local/bin/kubectl-argo-rollouts https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
          sudo chmod +x /usr/local/bin/kubectl-argo-rollouts

      - name: Apply ExternalSecrets Stores and Secret Manifests
        run: |
          kubectl get ns online-boutique >/dev/null 2>&1 || kubectl create ns online-boutique
          # keycloak namespace must exist before applying its ExternalSecret
          kubectl get ns keycloak >/dev/null 2>&1 || kubectl create ns keycloak
          if [ -d "kubernetes/external-secrets" ]; then
            echo "Applying ClusterSecretStore and external secrets..."
            kubectl apply -f kubernetes/external-secrets/cluster-secret-store.yaml
            sed "s/{{CLUSTER_NAME}}/${CLUSTER_NAME}/g" kubernetes/external-secrets/aurora-external-secret.yaml | kubectl apply -f -
            sed "s/{{CLUSTER_NAME}}/${CLUSTER_NAME}/g" kubernetes/external-secrets/redis-external-secret.yaml | kubectl apply -f -
            sed "s/{{CLUSTER_NAME}}/${CLUSTER_NAME}/g" kubernetes/external-secrets/sqs-external-secret.yaml | kubectl apply -f -
            sed "s/{{CLUSTER_NAME}}/${CLUSTER_NAME}/g" kubernetes/external-secrets/keycloak-external-secret.yaml | kubectl apply -f -
            sed "s/{{CLUSTER_NAME}}/${CLUSTER_NAME}/g" kubernetes/external-secrets/frontend-keycloak-external-secret.yaml | kubectl apply -f -
          fi

      - name: Pre-create Keycloak Database on Aurora
        run: |
          echo "Waiting for aurora-credentials ExternalSecret in online-boutique namespace..."
          kubectl wait --for=condition=Ready externalsecret/aurora-credentials -n online-boutique --timeout=90s

          echo "Ensuring 'keycloak' database exists on PostgreSQL / Aurora prior to Keycloak Helm installation..."
          kubectl delete job pre-keycloak-db-init -n online-boutique --ignore-not-found

          cat << 'EOF' | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: pre-keycloak-db-init
            namespace: online-boutique
          spec:
            backoffLimit: 3
            ttlSecondsAfterFinished: 120
            template:
              spec:
                restartPolicy: OnFailure
                containers:
                  - name: db-init
                    image: postgres:16-alpine
                    env:
                      - name: DB_HOST
                        valueFrom:
                          secretKeyRef:
                            name: aurora-credentials
                            key: DB_HOST
                      - name: DB_USER
                        valueFrom:
                          secretKeyRef:
                            name: aurora-credentials
                            key: DB_USER
                      - name: DB_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: aurora-credentials
                            key: DB_PASSWORD
                      - name: DB_PORT
                        valueFrom:
                          secretKeyRef:
                            name: aurora-credentials
                            key: DB_PORT
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        export PGPASSWORD="$DB_PASSWORD"
                        until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do
                          echo "Waiting for PostgreSQL at $DB_HOST:$DB_PORT..."
                          sleep 2
                        done
                        EXISTS=$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='keycloak'")
                        if [ "$EXISTS" != "1" ]; then
                          echo "Creating keycloak database..."
                          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -c "CREATE DATABASE keycloak;"
                          echo "Database keycloak created successfully."
                        else
                          echo "Database keycloak already exists."
                        fi
          EOF

          if ! kubectl wait --for=condition=complete job/pre-keycloak-db-init -n online-boutique --timeout=120s; then
            echo "ERROR: pre-keycloak-db-init job failed or timed out."
            kubectl logs job/pre-keycloak-db-init -n online-boutique 2>/dev/null || true
            exit 1
          fi
          kubectl delete job pre-keycloak-db-init -n online-boutique --ignore-not-found

      - name: Install Keycloak (Identity Provider)
        run: |
          # Wait for ESO to sync the keycloak-credentials secret before Helm install
          echo "Waiting for keycloak-credentials ExternalSecret to be Ready..."
          kubectl wait --for=condition=Ready externalsecret/keycloak-credentials -n keycloak --timeout=90s

          # Determine Aurora Host from Terraform output with AWS CLI fallback
          AURORA_HOST="${{ needs.infra-up.outputs.aurora_endpoint }}"
          if [ -z "$AURORA_HOST" ]; then
            echo "Looking up Aurora cluster endpoint via aws rds describe-db-clusters..."
            AURORA_HOST=$(aws rds describe-db-clusters --db-cluster-identifier "${CLUSTER_NAME}-aurora" --region ${{ github.event.inputs.aws_region }} --query 'DBClusters[0].Endpoint' --output text 2>/dev/null || true)
            if [ -z "$AURORA_HOST" ] || [ "$AURORA_HOST" == "None" ]; then
              echo "Looking up RDS DB instance endpoint via aws rds describe-db-instances..."
              AURORA_HOST=$(aws rds describe-db-instances --db-instance-identifier "${CLUSTER_NAME}-pg" --region ${{ github.event.inputs.aws_region }} --query 'DBInstances[0].Endpoint.Address' --output text 2>/dev/null || true)
            fi
          fi
          echo "Using Aurora database host: ${AURORA_HOST}"

          if kubectl get statefulset keycloak -n keycloak >/dev/null 2>&1 && [ "$(kubectl get statefulset keycloak -n keycloak -o jsonpath='{.status.readyReplicas}')" -ge 1 ] 2>/dev/null; then
            echo "Keycloak is already installed and healthy."
          else
            helm repo add bitnami https://charts.bitnami.com/bitnami
            helm repo update
            # Key configuration:
            #  - postgresql.enabled=false: Use our external Aurora instance
            #  - proxy=edge: Trust X-Forwarded-For headers from NGINX ingress
            #  - httpRelativePath=/auth/: Keycloak served at /auth path
            #  - readinessProbe.httpGet.path=/auth/realms/master: Match relative path
            #  - auth.adminUser: "admin" bootstrap user matching secret
            #  - auth.existingSecret: keycloak-credentials containing KEYCLOAK_ADMIN_PASSWORD
            #  - externalDatabase.*: pointing to Aurora endpoint and synced DB credentials
            helm upgrade --install keycloak bitnami/keycloak \
              --version "21.3.1" \
              --namespace keycloak \
              --create-namespace \
              --set image.registry="docker.io" \
              --set image.repository="bitnamilegacy/keycloak" \
              --set image.tag="24.0.4-debian-12-r1" \
              --set auth.adminUser="admin" \
              --set auth.existingSecret="keycloak-credentials" \
              --set auth.passwordSecretKey="KEYCLOAK_ADMIN_PASSWORD" \
              --set postgresql.enabled=false \
              --set externalDatabase.host="${AURORA_HOST}" \
              --set externalDatabase.port=5432 \
              --set externalDatabase.user="postgres" \
              --set externalDatabase.database="keycloak" \
              --set externalDatabase.existingSecret="keycloak-credentials" \
              --set externalDatabase.existingSecretUserKey="KC_DB_USERNAME" \
              --set externalDatabase.existingSecretPasswordKey="KC_DB_PASSWORD" \
              --set httpRelativePath="/auth/" \
              --set readinessProbe.httpGet.path="/auth/realms/master" \
              --set production=false \
              --set proxy=edge \
              --wait --timeout 8m
            echo "Keycloak Helm chart installed successfully."
          fi

      - name: Configure and Verify Keycloak Realms
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"
          case "$ENV_NAME" in
            prod)
              EXPECTED_SSL="ALL"
              ;;
            dev)
              EXPECTED_SSL="NONE"
              ;;
            *)
              echo "ERROR: Invalid or missing environment '${ENV_NAME}'. Must be explicitly 'prod' or 'dev'."
              exit 1
              ;;
          esac

          echo "Waiting for Keycloak pod to be Ready..."
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=keycloak -n keycloak --timeout=180s

          KEYCLOAK_POD=$(kubectl get pod -l app.kubernetes.io/name=keycloak -n keycloak -o jsonpath='{.items[0].metadata.name}')
          ADMIN_USER=$(kubectl get secret keycloak-credentials -n keycloak -o jsonpath='{.data.KEYCLOAK_ADMIN}' | base64 -d)
          ADMIN_PASS=$(kubectl get secret keycloak-credentials -n keycloak -o jsonpath='{.data.KEYCLOAK_ADMIN_PASSWORD}' | base64 -d)

          # Writable kcadm helper inside container
          kcadm() {
            kubectl exec -n keycloak "$KEYCLOAK_POD" -- /opt/bitnami/keycloak/bin/kcadm.sh --config /tmp/kcadm.config "$@"
          }

          # Verify kcadm server URL path matches Helm chart httpRelativePath
          CHART_HTTP_PATH="/auth"
          KCADM_SERVER="http://localhost:8080${CHART_HTTP_PATH}"
          echo "Verifying kcadm server path matches Helm chart httpRelativePath..."
          echo "  Chart httpRelativePath: ${CHART_HTTP_PATH}"
          echo "  kcadm server endpoint:  ${KCADM_SERVER}"

          echo "Authenticating kcadm CLI with master realm..."
          kcadm config credentials \
            --server "$KCADM_SERVER" \
            --realm master \
            --user "$ADMIN_USER" \
            --password "$ADMIN_PASS"

          # Retrieve client secret from dedicated AWS Secrets Manager secret for boutique-frontend (separate from Keycloak admin credentials)
          CLIENT_SECRET=$(aws secretsmanager get-secret-value --secret-id "${CLUSTER_NAME}/keycloak/boutique-frontend" --query SecretString --output text | jq -r '.client_secret // empty')
          if [ -z "$CLIENT_SECRET" ]; then
            echo "ERROR: boutique-frontend client secret is missing or empty in Secrets Manager at '${CLUSTER_NAME}/keycloak/boutique-frontend'!"
            exit 1
          fi

          echo "Checking if online-boutique realm exists..."
          if ! kcadm get realms/online-boutique >/dev/null 2>&1; then
            echo "Importing online-boutique realm from JSON specification..."
            kubectl cp kubernetes/keycloak/online-boutique-realm.json keycloak/"$KEYCLOAK_POD":/tmp/realm.json
            kcadm create realms -f /tmp/realm.json
          else
            echo "online-boutique realm exists. Ensuring roles and client are present..."
            # Ensure roles exist idempotently without failing on re-run
            for ROLE in customer admin; do
              if ! kcadm get roles/"$ROLE" -r online-boutique >/dev/null 2>&1; then
                echo "Creating role '$ROLE' in online-boutique realm..."
                kcadm create roles -r online-boutique -s name="$ROLE"
              else
                echo "Role '$ROLE' already exists in online-boutique realm."
              fi
            done

            # Ensure boutique-frontend client exists
            if ! kcadm get clients -r online-boutique -q clientId=boutique-frontend >/dev/null 2>&1; then
              kcadm create clients -r online-boutique \
                -s clientId=boutique-frontend \
                -s publicClient=false \
                -s standardFlowEnabled=true \
                -s directAccessGrantsEnabled=true \
                -s "redirectUris=[\"http://*\", \"https://*\"]"
            fi
          fi

          echo "Configuring boutique-frontend client secret and redirect URIs..."
          CLIENT_UUID=$(kcadm get clients -r online-boutique -q clientId=boutique-frontend --fields id --format csv --noquotes)
          if [ -n "$CLIENT_UUID" ]; then
            kcadm update clients/"$CLIENT_UUID" -r online-boutique \
              -s secret="$CLIENT_SECRET" \
              -s publicClient=false \
              -s "redirectUris=[\"http://*\", \"https://*\"]"
          fi

          echo "Applying sslRequired=${EXPECTED_SSL} to both master and online-boutique realms..."
          kcadm update realms/master -s sslRequired="${EXPECTED_SSL}"
          kcadm update realms/online-boutique -s sslRequired="${EXPECTED_SSL}" -s registrationAllowed=true

          echo "Verifying sslRequired configuration for both realms..."
          MASTER_SSL=$(kcadm get realms/master --fields sslRequired --format csv --noquotes)
          BOUTIQUE_SSL=$(kcadm get realms/online-boutique --fields sslRequired --format csv --noquotes)
          echo "  master realm sslRequired:          ${MASTER_SSL} (expected: ${EXPECTED_SSL})"
          echo "  online-boutique realm sslRequired: ${BOUTIQUE_SSL} (expected: ${EXPECTED_SSL})"

          if [ "$MASTER_SSL" != "$EXPECTED_SSL" ] || [ "$BOUTIQUE_SSL" != "$EXPECTED_SSL" ]; then
            echo "ERROR: Keycloak verification failed! Expected sslRequired=${EXPECTED_SSL}"
            exit 1
          fi
          echo "Keycloak realms and boutique-frontend client verified successfully!"

      - name: Annotate ServiceAccounts with SQS IRSA Role ARNs
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          CHECKOUT_ROLE="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${CLUSTER_NAME}-checkoutservice-sqs"
          EMAIL_ROLE="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${CLUSTER_NAME}-emailservice-sqs"
          SHIPPING_ROLE="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${CLUSTER_NAME}-shippingservice-sqs"

          echo "Ensuring ServiceAccounts exist in online-boutique namespace..."
          kubectl create sa checkoutservice -n online-boutique --dry-run=client -o yaml | kubectl apply -f -
          kubectl create sa emailservice -n online-boutique --dry-run=client -o yaml | kubectl apply -f -
          kubectl create sa shippingservice -n online-boutique --dry-run=client -o yaml | kubectl apply -f -

          echo "Annotating ServiceAccounts with IRSA role ARNs..."
          kubectl annotate sa checkoutservice -n online-boutique \
            eks.amazonaws.com/role-arn="${CHECKOUT_ROLE}" --overwrite
          kubectl annotate sa emailservice -n online-boutique \
            eks.amazonaws.com/role-arn="${EMAIL_ROLE}" --overwrite
          kubectl annotate sa shippingservice -n online-boutique \
            eks.amazonaws.com/role-arn="${SHIPPING_ROLE}" --overwrite

          echo "IRSA annotations applied — SQS producer/consumer pods inherit AWS credentials via OIDC federation."

      - name: Apply Ingress Routes (Frontend, Grafana, ArgoCD, Keycloak)
        run: |
          if [ -d "kubernetes/ingress" ]; then
            echo "Applying ingress routes for Online Boutique, Grafana, ArgoCD, and Keycloak..."
            kubectl apply -f kubernetes/ingress/
          fi

      - name: Register Online Boutique with ArgoCD (GitOps Handover)
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "Registering Online Boutique in ArgoCD for environment: ${ENV}..."
          kubectl apply -f kubernetes/argocd/app-project.yaml
          sed "s/values-prod.yaml/values-${ENV}.yaml/g" kubernetes/argocd/application.yaml | kubectl apply -f -
          echo "ArgoCD is now tracking https://github.com/Nadavvv20/online-boutique-gitops!"

      - name: Wait for ArgoCD Application Sync
        run: |
          echo "Waiting for ArgoCD to sync Online Boutique from GitOps repository..."
          SYNCED=false
          for i in $(seq 1 30); do
            STATUS=$(kubectl get application online-boutique -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "Pending")
            HEALTH=$(kubectl get application online-boutique -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || echo "Pending")
            echo "ArgoCD Sync Status: $STATUS, Health: $HEALTH ($i/30)"
            if [ "$STATUS" == "Synced" ] && [ "$HEALTH" == "Healthy" ]; then
              echo "Online Boutique is fully synced and healthy via ArgoCD!"
              SYNCED=true
              break
            fi
            sleep 10
          done

          if [ "$SYNCED" != "true" ]; then
            echo "ERROR: ArgoCD Application online-boutique failed to reach Synced+Healthy within the expected time."
            echo "=== ArgoCD Application Details ==="
            kubectl get application -n argocd || true
            echo "=== online-boutique Namespace Pods ==="
            kubectl get pods -n online-boutique || true
            exit 1
          fi

      - name: Verify Workloads Rollout & Print Access URLs
        run: |
          echo "Pods in online-boutique namespace:"
          kubectl get pods -n online-boutique -o wide
          echo ""
          echo "Keycloak pods:"
          kubectl get pods -n keycloak -o wide || true
          echo ""
          echo "Ingress resources in online-boutique namespace:"
          kubectl get ingress -n online-boutique -o wide || true
          echo ""
          echo "=========================================================="
          echo "Public Ingress-NGINX Load Balancer Address:"
          ALB=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true)
          echo "  ALB Address:        http://${ALB}"
          echo "  Online Boutique:    http://${ALB}/"
          echo "  Keycloak Admin UI:  http://${ALB}/auth/admin"
          echo "  ArgoCD UI:          http://${ALB}/argocd"
          echo "  Grafana:            http://${ALB}/grafana"
          echo "=========================================================="
          echo "Online Boutique with Auth & Event-Driven Architecture deployed successfully!"

      - name: Enable Rate Limit Bypass for Smoke Tests (Non-Prod Only)
        if: ${{ github.event.inputs.run_smoke_tests == 'true' || github.event.inputs.run_smoke_tests == true }}
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"
          if [ "$ENV_NAME" != "prod" ]; then
            echo "Non-prod environment ($ENV_NAME): Enabling ENABLE_TEST_RATE_LIMIT_BYPASS=true on frontend rollout..."
            kubectl argo rollouts set env rollout/frontend -n online-boutique ENABLE_TEST_RATE_LIMIT_BYPASS=true
            kubectl argo rollouts status rollout/frontend -n online-boutique --timeout=90s
          else
            echo "Production environment detected ($ENV_NAME): ENABLE_TEST_RATE_LIMIT_BYPASS remains hard-disabled."
          fi

      - name: Create Temporary Keycloak Smoke Test User
        id: create_smoke_user
        if: ${{ github.event.inputs.run_smoke_tests == 'true' || github.event.inputs.run_smoke_tests == true }}
        run: |
          # Generate random username and password at runtime
          SMOKE_USER="smoke-$(openssl rand -hex 4)"
          SMOKE_PASS=$(openssl rand -base64 18 | tr -dc 'a-zA-Z0-9!@#%')
          
          # Mask credentials in GitHub Actions logs so they are never exposed
          echo "::add-mask::${SMOKE_PASS}"
          echo "::add-mask::${SMOKE_USER}"
          
          echo "KEYCLOAK_TEST_USER=${SMOKE_USER}" >> "$GITHUB_ENV"
          echo "KEYCLOAK_TEST_PASSWORD=${SMOKE_PASS}" >> "$GITHUB_ENV"
          
          echo "Creating temporary test user '${SMOKE_USER}' in Keycloak online-boutique realm..."
          KEYCLOAK_POD=$(kubectl get pod -l app.kubernetes.io/name=keycloak -n keycloak -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n keycloak "$KEYCLOAK_POD" -- /opt/bitnami/keycloak/bin/kcadm.sh create users -r online-boutique \
            -s username="${SMOKE_USER}" \
            -s enabled=true \
            -s email="${SMOKE_USER}@example.com"
          kubectl exec -n keycloak "$KEYCLOAK_POD" -- /opt/bitnami/keycloak/bin/kcadm.sh set-password -r online-boutique \
            --username "${SMOKE_USER}" \
            --new-password "${SMOKE_PASS}"
          echo "Temporary Keycloak smoke user created successfully."

      - name: Setup Go for Architecture Smoke Tests
        if: ${{ github.event.inputs.run_smoke_tests == 'true' || github.event.inputs.run_smoke_tests == true }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Architecture Validation Smoke Tests
        id: run_smoke
        if: ${{ github.event.inputs.run_smoke_tests == 'true' || github.event.inputs.run_smoke_tests == true }}
        run: |
          mkdir -p tests/smoke/logs
          ALB=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true)
          echo "Starting smoke test suite against ALB: http://${ALB}"
          export BASE_URL="http://${ALB}"
          export AWS_REGION="${{ github.event.inputs.aws_region }}"
          export RUN_DESTRUCTIVE="${{ github.event.inputs.run_destructive_tests || 'false' }}"
          chmod +x scripts/run-smoke-tests.sh
          # Pipe output through tee to preserve logs for artifact upload on failure or success
          ./scripts/run-smoke-tests.sh 2>&1 | tee tests/smoke/logs/smoke-tests.log

      - name: Upload Smoke Test Logs Artifact
        if: ${{ always() && steps.run_smoke.outcome != 'skipped' && steps.run_smoke.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ github.event.inputs.environment }}
          path: tests/smoke/logs/
          retention-days: 14

      - name: Delete Temporary Keycloak User
        if: ${{ always() && steps.create_smoke_user.outcome == 'success' }}
        run: |
          if [ -n "$KEYCLOAK_TEST_USER" ]; then
            echo "Deleting temporary Keycloak user '${KEYCLOAK_TEST_USER}'..."
            KEYCLOAK_POD=$(kubectl get pod -l app.kubernetes.io/name=keycloak -n keycloak -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$KEYCLOAK_POD" ]; then
              USER_ID=$(kubectl exec -n keycloak "$KEYCLOAK_POD" -- /opt/bitnami/keycloak/bin/kcadm.sh get users -r online-boutique -q username="${KEYCLOAK_TEST_USER}" --fields id --format csv --noquotes 2>/dev/null || true)
              if [ -n "$USER_ID" ]; then
                kubectl exec -n keycloak "$KEYCLOAK_POD" -- /opt/bitnami/keycloak/bin/kcadm.sh delete users/"$USER_ID" -r online-boutique
                echo "Temporary Keycloak user '${KEYCLOAK_TEST_USER}' deleted successfully."
              fi
            fi
          fi

      - name: Revert Rate Limit Bypass on Frontend (Non-Prod Only)
        if: ${{ always() && (github.event.inputs.run_smoke_tests == 'true' || github.event.inputs.run_smoke_tests == true) }}
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"
          if [ "$ENV_NAME" != "prod" ]; then
            echo "Reverting ENABLE_TEST_RATE_LIMIT_BYPASS=false on frontend rollout..."
            kubectl argo rollouts set env rollout/frontend -n online-boutique ENABLE_TEST_RATE_LIMIT_BYPASS=false
          fi
