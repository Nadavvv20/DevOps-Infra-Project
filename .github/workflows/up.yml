name: Up - Infrastructure & Application Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target AWS Environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      aws_region:
        description: "AWS Region"
        required: true
        default: "il-central-1"
      skip_vpc:
        description: "Target existing VPC (skip re-applying VPC module if already exists)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  HELM_VERSION: "v3.15.4"

jobs:
  infra-up:
    name: Provision Infrastructure (Terraform)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      cluster_name: ${{ steps.tf_outputs.outputs.cluster_name }}
    defaults:
      run:
        working-directory: terraform/environments/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== Decoded GitHub OIDC Claims ==="
          echo "$TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson'

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply (Infra & Data Tier)
        run: |
          if [ "${{ github.event.inputs.skip_vpc }}" == "true" ]; then
            echo "Targeting existing VPC: applying EKS, Karpenter, DBs, and IAM..."
            terraform apply -auto-approve \
              -target=module.eks \
              -target=module.karpenter \
              -target=module.rds_aurora \
              -target=module.elasticache \
              -target=module.iam_roles
          else
            echo "Applying full infrastructure..."
            terraform apply -auto-approve
          fi

      - name: Export Outputs
        id: tf_outputs
        run: |
          CLUSTER_NAME="online-boutique-${{ github.event.inputs.environment }}"
          if RAW_OUT=$(terraform output -raw cluster_name 2>/dev/null) && [ -n "$RAW_OUT" ] && [[ "$RAW_OUT" != *"Warning"* ]]; then
            CLUSTER_NAME="$RAW_OUT"
          fi
          echo "Using cluster name: ${CLUSTER_NAME}"
          echo "cluster_name=${CLUSTER_NAME}" >> "$GITHUB_OUTPUT"

  apps-up:
    name: Deploy Core Controllers & Online Boutique (Helm)
    needs: infra-up
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Setup Kubectl & Helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.infra-up.outputs.cluster_name }} \
            --region ${{ github.event.inputs.aws_region }}

      - name: Wait for EKS Control Plane & Nodes
        run: |
          echo "Waiting for Kubernetes API..."
          until kubectl get nodes >/dev/null 2>&1; do
            echo "Waiting for node communication..."
            sleep 10
          done
          echo "Kubernetes nodes status:"
          kubectl get nodes -o wide

      - name: Install Ingress-NGINX / AWS Load Balancer Controller
        run: |
          if helm status ingress-nginx -n ingress-nginx >/dev/null 2>&1; then
            echo "ingress-nginx is already installed. Skipping reinstall."
          else
            helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
            helm repo update
            helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
              --namespace ingress-nginx \
              --create-namespace \
              --set controller.service.type=LoadBalancer \
              --wait --timeout 5m
          fi

      - name: Install External Secrets Operator (ESO)
        run: |
          echo "Checking and applying External Secrets CRDs..."
          if kubectl get crd externalsecrets.external-secrets.io -o jsonpath='{.status.storedVersions}' 2>/dev/null | grep -q 'v1"'; then
            echo "Removing incompatible v1 CRD definitions from earlier test..."
            kubectl delete crd clusterexternalsecrets.external-secrets.io clustersecretstores.external-secrets.io externalsecrets.external-secrets.io secretstores.external-secrets.io --ignore-not-found
          fi
          kubectl apply -f kubernetes/crds/external-secrets-crds.yaml --server-side --force-conflicts
          kubectl wait --for=condition=Established crd/externalsecrets.external-secrets.io crd/clustersecretstores.external-secrets.io --timeout=60s
          if helm status external-secrets -n external-secrets >/dev/null 2>&1; then
            echo "external-secrets is already installed. Skipping reinstall."
          else
            helm repo add external-secrets https://charts.external-secrets.io
            helm repo update
            helm upgrade --install external-secrets external-secrets/external-secrets \
              --namespace external-secrets \
              --create-namespace \
              --set installCRDs=false \
              --wait --timeout 5m
          fi

      - name: Install Prometheus & Grafana (kube-prometheus-stack)
        run: |
          if helm status prometheus -n monitoring >/dev/null 2>&1; then
            echo "prometheus stack is already installed. Skipping reinstall."
          else
            helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
            helm repo update
            helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
              --namespace monitoring \
              --create-namespace \
              --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
              --wait --timeout 7m
          fi

      - name: Install ArgoCD
        run: |
          if helm status argocd -n argocd >/dev/null 2>&1; then
            echo "argocd is already installed. Skipping reinstall."
          else
            helm repo add argo https://argoproj.github.io/argo-helm
            helm repo update
            helm upgrade --install argocd argo/argo-cd \
              --namespace argocd \
              --create-namespace \
              --set server.service.type=ClusterIP \
              --wait --timeout 5m
          fi

      - name: Apply ExternalSecrets Stores and Secret Manifests
        run: |
          kubectl get ns online-boutique >/dev/null 2>&1 || kubectl create ns online-boutique
          if [ -d "kubernetes/external-secrets" ]; then
            echo "Applying external secrets stores and manifests..."
            kubectl apply -f kubernetes/external-secrets/
          fi

      - name: Deploy Google Online Boutique Application via Helm
        run: |
          ENV="${{ github.event.inputs.environment }}"
          echo "Deploying Online Boutique for environment: ${ENV}"
          helm upgrade --install online-boutique helm/online-boutique \
            --namespace online-boutique \
            --create-namespace \
            --values helm/online-boutique/values.yaml \
            --values helm/online-boutique/values-${ENV}.yaml \
            --wait --timeout 10m

      - name: Apply Ingress Routes (Frontend, Grafana, ArgoCD)
        run: |
          if [ -d "kubernetes/ingress" ]; then
            echo "Applying ingress routes for Online Boutique, Grafana, and ArgoCD..."
            kubectl apply -f kubernetes/ingress/
          fi

      - name: Register Online Boutique with ArgoCD (GitOps Handover)
        run: |
          echo "Applying ArgoCD AppProject and Application manifests..."
          kubectl apply -f kubernetes/argocd/app-project.yaml || true
          kubectl apply -f kubernetes/argocd/application.yaml || true
          echo "ArgoCD is now tracking https://github.com/Nadavvv20/online-boutique-gitops!"

      - name: Verify Workloads Rollout
        run: |
          echo "Pods in online-boutique namespace:"
          kubectl get pods -n online-boutique -o wide
          echo ""
          echo "Ingress resources in online-boutique namespace:"
          kubectl get ingress -n online-boutique -o wide || true
          echo ""
          echo "=========================================================="
          echo "Public Ingress-NGINX Load Balancer Address:"
          kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true
          echo ""
          echo "=========================================================="
          echo "Online Boutique deployed successfully!"

