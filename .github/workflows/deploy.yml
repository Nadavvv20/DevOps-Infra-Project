name: Deploy via ArgoCD

on:
  workflow_run:
    workflows: ["Build & Scan Container Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, prod]
      sync_strategy:
        description: "ArgoCD sync strategy"
        required: false
        type: choice
        options: [auto, manual]
        default: auto

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Sync ArgoCD (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: il-central-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name online-boutique-${{ github.event.inputs.environment || 'dev' }} \
            --region il-central-1

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: ArgoCD login (via port-forward)
        run: |
          kubectl port-forward svc/argocd-server -n argocd 8080:443 &
          sleep 3
          ARGOCD_PWD=$(kubectl get secret argocd-initial-admin-secret \
            -n argocd -o jsonpath="{.data.password}" | base64 -d)
          argocd login localhost:8080 \
            --username admin \
            --password "${ARGOCD_PWD}" \
            --insecure \
            --grpc-web

      - name: Sync application
        run: |
          argocd app sync online-boutique \
            --prune \
            --timeout 300 \
            --retry-limit 3

      - name: Wait for healthy state
        run: |
          argocd app wait online-boutique \
            --health \
            --timeout 300

      - name: Verify rollout
        run: |
          kubectl wait --for=condition=Ready pod -l app=frontend -n online-boutique --timeout=5m
          kubectl get pods -n online-boutique -o wide

      - name: Run smoke tests
        run: |
          FRONTEND_URL=$(kubectl get ingress online-boutique-ingress \
            -n online-boutique \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Testing frontend at: https://${FRONTEND_URL}"
          curl -sf --retry 5 --retry-delay 10 \
            -o /dev/null -w "%{http_code}" \
            "https://${FRONTEND_URL}/_healthz" | grep -q "200"

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: ":x: Deployment failed for online-boutique in ${{ github.event.inputs.environment || 'dev' }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

