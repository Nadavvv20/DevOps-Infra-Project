name: Down - Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target AWS Environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      aws_region:
        description: "AWS Region"
        required: true
        default: "il-central-1"
      keep_vpc:
        description: "Preserve VPC & Networking (Only destroy EKS cluster, DBs, and workloads to save time)"
        type: boolean
        default: true
      confirm_destroy:
        description: "Type 'DESTROY' to confirm teardown"
        required: true
        default: "ABORT"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.5"
  HELM_VERSION: "v3.15.4"

jobs:
  validate-guardrails:
    name: Guardrails & Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "ERROR: Destruction aborted. You must type DESTROY in the confirm_destroy field."
            exit 1
          fi
          echo "Destruction confirmed for environment: ${{ github.event.inputs.environment }}"

  clean-k8s:
    name: Clean Ingresses, LBs & Helm Releases
    needs: validate-guardrails
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Setup Kubectl & Helm
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Update Kubeconfig (if cluster exists)
        id: kubeconfig
        run: |
          CLUSTER_NAME="online-boutique-${{ github.event.inputs.environment }}"
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region ${{ github.event.inputs.aws_region }} >/dev/null 2>&1; then
            aws eks update-kubeconfig --name "$CLUSTER_NAME" --region ${{ github.event.inputs.aws_region }}
            echo "cluster_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cluster $CLUSTER_NAME not found or already deleted."
            echo "cluster_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete Kubernetes LoadBalancers & Ingresses (Prevent AWS VPC ENI leaks)
        if: steps.kubeconfig.outputs.cluster_found == 'true'
        run: |
          echo "Deleting all Ingress resources across all namespaces..."
          kubectl delete ingress --all --all-namespaces --ignore-not-found --timeout=3m || true

          echo "Deleting all Services of type LoadBalancer across all namespaces..."
          kubectl delete svc --all-namespaces --field-selector spec.type=LoadBalancer --ignore-not-found --timeout=3m || true
          kubectl delete svc -n ingress-nginx ingress-nginx-controller --ignore-not-found --timeout=3m || true
          
          echo "Stripping finalizers and deleting ArgoCD Application & AppProject for online-boutique..."
          kubectl patch application online-boutique -n argocd -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          kubectl delete application online-boutique -n argocd --ignore-not-found --wait=false 2>/dev/null || true
          kubectl patch appproject online-boutique -n argocd -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          kubectl delete appproject online-boutique -n argocd --ignore-not-found --wait=false 2>/dev/null || true

          echo "Uninstalling online-boutique Helm release and workloads..."
          helm uninstall online-boutique -n online-boutique --ignore-not-found || true
          kubectl patch rollouts.argoproj.io --all -n online-boutique -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          kubectl delete rollouts.argoproj.io --all -n online-boutique --ignore-not-found --wait=false 2>/dev/null || true
          kubectl delete all --all -n online-boutique --ignore-not-found --wait=false 2>/dev/null || true
          kubectl delete ns online-boutique --ignore-not-found --wait=false 2>/dev/null || true

          echo "Uninstalling other Helm releases and cleaning namespaces..."
          helm uninstall keycloak -n keycloak --ignore-not-found || true
          kubectl delete ns keycloak --ignore-not-found --wait=false 2>/dev/null || true
          helm uninstall argo-rollouts -n argo-rollouts --ignore-not-found || true
          helm uninstall argocd -n argocd --ignore-not-found || true
          helm uninstall opencost -n opencost --ignore-not-found || true
          kubectl delete ns opencost --ignore-not-found --wait=false 2>/dev/null || true
          helm uninstall prometheus -n monitoring --ignore-not-found || true
          helm uninstall external-secrets -n external-secrets --ignore-not-found || true
          helm uninstall ingress-nginx -n ingress-nginx --ignore-not-found || true
          helm uninstall karpenter -n kube-system --ignore-not-found || true
          helm uninstall karpenter-crd -n kube-system --ignore-not-found || true

          echo "Deleting Karpenter NodeClaims to cleanly release dynamic EC2 instances..."
          kubectl delete nodeclaims --all --ignore-not-found --wait=false 2>/dev/null || true

          echo "Waiting for AWS cloud load balancers and ENIs to be released..."
          for i in $(seq 1 18); do
            REMAINING_LBS=$(kubectl get svc --all-namespaces --field-selector spec.type=LoadBalancer --no-headers 2>/dev/null)
            if [ -z "$REMAINING_LBS" ]; then
              echo "All LoadBalancer services successfully terminated."
              break
            fi
            echo "Waiting for LoadBalancer services to release AWS ALBs/NLBs (attempt $i/18)..."
            sleep 10
          done
          sleep 30

  destroy-infra:
    name: Destroy Infrastructure (Terraform)
    needs: clean-k8s
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ github.event.inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform Targeted Destroy
        run: |
          if [ "${{ github.event.inputs.keep_vpc }}" == "true" ]; then
            echo "Targeted destroy: Deleting EKS, Karpenter, DBs, SQS, Keycloak secrets, Ads CDN, and IAM while PRESERVING VPC..."
            terraform destroy -auto-approve \
              -target=module.eks \
              -target=module.karpenter \
              -target=module.rds_aurora \
              -target=module.elasticache \
              -target=module.sqs \
              -target=module.secrets_manager \
              -target=module.ads_cdn \
              -target=module.iam_roles
            echo "EKS and Databases destroyed. VPC and ECR retained."
          else
            echo "Full destroy: Deleting ALL infrastructure including VPC and subnets..."
            terraform destroy -auto-approve
          fi

      - name: Purge Pending-Deletion Secrets Manager Secrets
        if: always()
        run: |
          CLUSTER_NAME="online-boutique-${{ github.event.inputs.environment }}"
          chmod +x "${GITHUB_WORKSPACE}/scripts/purge-deleted-secrets.sh"
          "${GITHUB_WORKSPACE}/scripts/purge-deleted-secrets.sh" \
            --region "${{ github.event.inputs.aws_region }}" \
            --prefix "${CLUSTER_NAME}" \
            --yes

