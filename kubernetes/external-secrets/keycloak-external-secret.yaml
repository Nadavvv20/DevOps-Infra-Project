apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-credentials
  namespace: keycloak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: keycloak-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Keycloak admin bootstrap credentials
        KEYCLOAK_ADMIN:          "{{ .admin_user }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .admin_password }}"
        # Aurora PostgreSQL connection for Keycloak's own schema (separate DB)
        KC_DB:          "postgres"
        KC_DB_URL:      "jdbc:postgresql://{{ .db_host }}:{{ .db_port }}/keycloak"
        KC_DB_USERNAME: "{{ .db_user }}"
        KC_DB_PASSWORD: "{{ .db_password }}"
  data:
    - secretKey: admin_user
      remoteRef:
        key: {{CLUSTER_NAME}}/keycloak/credentials
        property: admin_user
    - secretKey: admin_password
      remoteRef:
        key: {{CLUSTER_NAME}}/keycloak/credentials
        property: admin_password
    - secretKey: db_host
      remoteRef:
        key: {{CLUSTER_NAME}}/aurora/credentials
        property: host
    - secretKey: db_port
      remoteRef:
        key: {{CLUSTER_NAME}}/aurora/credentials
        property: port
    - secretKey: db_user
      remoteRef:
        key: {{CLUSTER_NAME}}/aurora/credentials
        property: username
    - secretKey: db_password
      remoteRef:
        key: {{CLUSTER_NAME}}/aurora/credentials
        property: password
