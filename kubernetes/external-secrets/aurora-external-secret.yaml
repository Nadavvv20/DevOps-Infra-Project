apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: aurora-credentials
  namespace: online-boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: aurora-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DB_HOST:     "{{ .host }}"
        DB_PORT:     "{{ .port }}"
        DB_NAME:     "{{ .dbname }}"
        DB_USER:     "{{ .username }}"
        DB_PASSWORD: "{{ .password }}"
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}"
  data:
    - secretKey: host
      remoteRef:
        key: online-boutique-prod/aurora/credentials
        property: host
    - secretKey: port
      remoteRef:
        key: online-boutique-prod/aurora/credentials
        property: port
    - secretKey: dbname
      remoteRef:
        key: online-boutique-prod/aurora/credentials
        property: dbname
    - secretKey: username
      remoteRef:
        key: online-boutique-prod/aurora/credentials
        property: username
    - secretKey: password
      remoteRef:
        key: online-boutique-prod/aurora/credentials
        property: password
