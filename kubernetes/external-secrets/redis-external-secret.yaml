apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: online-boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        REDIS_HOST:      "{{ .primary_endpoint }}"
        REDIS_PORT:      "6379"
        REDIS_ADDR:      "{{ .primary_endpoint }}:6379"
        REDIS_AUTH:      "{{ .auth_token }}"
        REDIS_AUTH_TOKEN: "{{ .auth_token }}"
        REDIS_PASSWORD:  "{{ .auth_token }}"
        REDIS_USE_TLS:   "true"
        REDIS_TLS:       "true"
        REDIS_URL:       "rediss://:{{ .auth_token }}@{{ .primary_endpoint }}:6379"
        CART_REDIS_CONNECTION_STRING: "{{ .primary_endpoint }}:6379,password={{ .auth_token }},ssl=true,abortConnect=false"
  data:
    - secretKey: primary_endpoint
      remoteRef:
        key: {{CLUSTER_NAME}}/redis/auth
        property: primary_endpoint
    - secretKey: auth_token
      remoteRef:
        key: {{CLUSTER_NAME}}/redis/auth
        property: auth_token
