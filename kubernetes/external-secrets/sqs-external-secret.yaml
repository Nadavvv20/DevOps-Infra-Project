apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sqs-config
  namespace: online-boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: sqs-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # checkoutservice: publishes to SNS topic
        ORDER_EVENTS_TOPIC_ARN: "{{ .order_events_topic_arn }}"
        # emailservice: consumes from email queue
        ORDER_EVENTS_EMAIL_URL: "{{ .order_events_email_url }}"
        ORDER_EVENTS_EMAIL_DLQ_URL: "{{ .order_events_email_dlq_url }}"
        # shippingservice: consumes from shipping queue
        ORDER_EVENTS_SHIPPING_URL: "{{ .order_events_shipping_url }}"
        ORDER_EVENTS_SHIPPING_DLQ_URL: "{{ .order_events_shipping_dlq_url }}"
  data:
    - secretKey: order_events_topic_arn
      remoteRef:
        key: {{CLUSTER_NAME}}/sqs/order-events
        property: order_events_topic_arn
    - secretKey: order_events_email_url
      remoteRef:
        key: {{CLUSTER_NAME}}/sqs/order-events
        property: email_queue_url
    - secretKey: order_events_email_dlq_url
      remoteRef:
        key: {{CLUSTER_NAME}}/sqs/order-events
        property: email_dlq_url
    - secretKey: order_events_shipping_url
      remoteRef:
        key: {{CLUSTER_NAME}}/sqs/order-events
        property: shipping_queue_url
    - secretKey: order_events_shipping_dlq_url
      remoteRef:
        key: {{CLUSTER_NAME}}/sqs/order-events
        property: shipping_dlq_url
