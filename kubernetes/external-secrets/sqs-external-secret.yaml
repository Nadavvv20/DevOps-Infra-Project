apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sqs-config
  namespace: online-boutique
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: sqs-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # checkoutservice: reads this to know where to publish
        ORDER_EVENTS_QUEUE_URL: "{{ .order_events_queue_url }}"
        ORDER_EVENTS_QUEUE_ARN: "{{ .order_events_queue_arn }}"
        # emailservice / shippingservice: also reads the DLQ URL for monitoring
        ORDER_EVENTS_DLQ_URL: "{{ .order_events_dlq_url }}"
  data:
    - secretKey: order_events_queue_url
      remoteRef:
        key: {{CLUSTER_NAME}}/sqs/order-events
        property: order_events_queue_url
    - secretKey: order_events_queue_arn
      remoteRef:
        key: {{CLUSTER_NAME}}/sqs/order-events
        property: order_events_queue_arn
    - secretKey: order_events_dlq_url
      remoteRef:
        key: {{CLUSTER_NAME}}/sqs/order-events
        property: order_events_dlq_url
