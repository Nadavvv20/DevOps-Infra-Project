apiVersion: batch/v1
kind: Job
metadata:
  name: db-schema-migration-verifier
  namespace: online-boutique
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      name: db-schema-migration-verifier
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-verifier
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: aurora-credentials
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "=========================================================="
              echo "1. Connecting to PostgreSQL database: $DB_NAME on $DB_HOST:$DB_PORT..."
              echo "=========================================================="
              export PGPASSWORD="$DB_PASSWORD"
              
              # Wait for DB to be reachable
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"; do
                echo "Waiting for database to accept connections..."
                sleep 2
              done
              echo "Database is ready!"

              echo ""
              echo "=========================================================="
              echo "2. Applying Online Boutique Schema (if not exists)..."
              echo "=========================================================="
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" << 'EOF'
              CREATE TABLE IF NOT EXISTS orders (
                  order_id VARCHAR(64) PRIMARY KEY,
                  user_id VARCHAR(64) NOT NULL,
                  user_currency VARCHAR(8) NOT NULL,
                  total_cost_units BIGINT NOT NULL,
                  total_cost_nanos INT NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS order_items (
                  item_id SERIAL PRIMARY KEY,
                  order_id VARCHAR(64) REFERENCES orders(order_id) ON DELETE CASCADE,
                  product_id VARCHAR(64) NOT NULL,
                  quantity INT NOT NULL,
                  cost_units BIGINT NOT NULL,
                  cost_nanos INT NOT NULL
              );

              CREATE TABLE IF NOT EXISTS customers (
                  customer_id VARCHAR(64) PRIMARY KEY,
                  email VARCHAR(255) UNIQUE NOT NULL,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
              );

              CREATE INDEX IF NOT EXISTS idx_orders_user ON orders(user_id);
              CREATE INDEX IF NOT EXISTS idx_order_items_order ON order_items(order_id);
              EOF

              echo ""
              echo "=========================================================="
              echo "3. Verifying Migrated Tables..."
              echo "=========================================================="
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "\dt"
              
              echo ""
              echo "=========================================================="
              echo "4. Table Schema Details:"
              echo "=========================================================="
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "\d orders"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "\d order_items"
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "\d customers"

              echo ""
              echo "=========================================================="
              echo "5. Row Counts & Health Check:"
              echo "=========================================================="
              psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "
              SELECT
                  'orders' AS table_name, count(*) AS row_count FROM orders
              UNION ALL
              SELECT
                  'order_items' AS table_name, count(*) AS row_count FROM order_items
              UNION ALL
              SELECT
                  'customers' AS table_name, count(*) AS row_count FROM customers;
              "
              echo ""
              echo "SUCCESS: Database migration and verification completed successfully!"
