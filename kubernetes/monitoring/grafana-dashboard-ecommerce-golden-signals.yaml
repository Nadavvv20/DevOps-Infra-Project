apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ecommerce-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    release: kube-prometheus-stack
data:
  ecommerce-golden-signals.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Executive Summary & SLO Health (Golden Signals Overview)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Global Ingress Traffic (RPS)",
          "type": "stat",
          "targets": [
            {
              "expr": "(sum(rate(nginx_ingress_controller_nginx_process_requests_total[1m])) or vector(0))",
              "legendFormat": "RPS",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "max": 100,
              "min": 95,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 99 },
                  { "color": "yellow", "value": 99.5 },
                  { "color": "green", "value": 99.9 }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "id": 2,
          "options": {
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "Availability vs SLO (Target: 99.9%)",
          "type": "gauge",
          "targets": [
            {
              "expr": "100 - (100 * (sum(rate(nginx_ingress_controller_requests{status=~\"5..\"}[5m])) or vector(0)) / (sum(rate(nginx_ingress_controller_requests[5m])) or vector(1)))",
              "legendFormat": "Availability %",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Server Response Time (TTFB - Time To First Byte). Google Core Web Vitals: <200ms (Good), 200-500ms (Needs Improvement), >500ms (Poor). Measures backend + network transmission before browser rendering (LCP/Page Load).",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 200 },
                  { "color": "red", "value": 500 }
                ]
              },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Frontend Response Time (TTFB) P99",
          "type": "stat",
          "targets": [
            {
              "expr": "(histogram_quantile(0.99, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[2m])) by (le)) * 1000) or vector(0)",
              "legendFormat": "P99 TTFB (ms)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "blue", "value": 10 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Orders Processed / min",
          "type": "stat",
          "targets": [
            {
              "expr": "(sum(rate(inventory_reservations_total{result=\"ok\"}[1m])) * 60) or vector(0)",
              "legendFormat": "Orders/min",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 100 },
                  { "color": "blue", "value": 500 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Active Cart Holds (In-Flight)",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(inventory_active_holds) or vector(0)",
              "legendFormat": "Active Holds",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "title": "Out-of-Stock / Error Alerts",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(inventory_reservations_total{result=\"out_of_stock\"}) or vector(0)",
              "legendFormat": "Out of Stock",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 200,
          "title": "Golden Signal 1: Latency & Response Times (Service Level Indicators)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisGridShow": true, "fillOpacity": 15, "lineWidth": 2, "spanNulls": true },
              "unit": "ms"
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": ".*[pP]99.*" },
                "properties": [{ "id": "custom.lineWidth", "value": 3 }]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 6 },
          "id": 7,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "description": "Server Response Time (TTFB) by percentile (P50, P90, P99) measured at Ingress Edge. Excludes browser rendering.",
          "title": "Server Response Time (TTFB) Profiles (P50, P90, P99)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "Ingress Edge - P99 (ms)",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "Ingress Edge - P90 (ms)",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "Ingress Edge - P50 (ms)",
              "refId": "C"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisGridShow": true, "fillOpacity": 25, "lineWidth": 2, "spanNulls": true },
              "unit": "ms"
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": ".*[pP]99.*" },
                "properties": [{ "id": "custom.lineWidth", "value": 3 }]
              }
            ]
          },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 6 },
          "id": 75,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Checkout Latency (Place Order — POST)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{method=\"POST\"}[2m])) by (le)) * 1000",
              "legendFormat": "Checkout P99 (ms)",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{method=\"POST\"}[2m])) by (le)) * 1000",
              "legendFormat": "Checkout P90 (ms)",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket{method=\"POST\"}[2m])) by (le)) * 1000",
              "legendFormat": "Checkout P50 (ms)",
              "refId": "C"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisGridShow": true, "fillOpacity": 15, "lineWidth": 2, "spanNulls": true },
              "unit": "ms"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 6 },
          "id": 8,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Ingress Edge Latency vs Upstream Response",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "Ingress Edge P99",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "Ingress Edge P50",
              "refId": "B"
            },
            {
              "expr": "(sum(rate(nginx_ingress_controller_ingress_upstream_latency_seconds_sum[2m])) / sum(rate(nginx_ingress_controller_ingress_upstream_latency_seconds_count[2m]))) * 1000",
              "legendFormat": "Upstream Response Time",
              "refId": "C"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "id": 300,
          "title": "Golden Signal 2 & 3: Traffic Throughput & Error Rate Budgets",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Live traffic volume by HTTP status class. Unstacked so that each class reflects its true value and 5xx errors stay at the 0 baseline.",
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisGridShow": true, "fillOpacity": 10, "lineWidth": 2, "stacking": { "mode": "none" } },
              "unit": "reqps"
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "2xx Success" }, "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "3xx Redirect" }, "properties": [{ "id": "color", "value": { "fixedColor": "blue", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "4xx Client Error" }, "properties": [{ "id": "color", "value": { "fixedColor": "yellow", "mode": "fixed" } }] },
              { "matcher": { "id": "byName", "options": "5xx Server Error" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }, { "id": "custom.lineWidth", "value": 3 }] }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "id": 9,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Traffic Volume by HTTP Status Class",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{status=~\"2..\"}[1m])) or vector(0)",
              "legendFormat": "2xx Success",
              "refId": "A"
            },
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{status=~\"3..\"}[1m])) or vector(0)",
              "legendFormat": "3xx Redirect",
              "refId": "B"
            },
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{status=~\"4..\"}[1m])) or vector(0)",
              "legendFormat": "4xx Client Error",
              "refId": "C"
            },
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{status=~\"5..\"}[1m])) or vector(0)",
              "legendFormat": "5xx Server Error",
              "refId": "D"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "axisCenteredZero": false, "axisGridShow": true, "fillOpacity": 15, "lineWidth": 2 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 6 },
                  { "color": "red", "value": 14 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "id": 10,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "SLO Error Budget Burn Rate (1h & 6h Multi-Window)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "((sum(rate(nginx_ingress_controller_requests{status=~\"5..\"}[1h])) or vector(0)) / (sum(rate(nginx_ingress_controller_requests[1h])) or vector(1))) / 0.001",
              "legendFormat": "1h Burn Rate (Critical > 14x)",
              "refId": "A"
            },
            {
              "expr": "((sum(rate(nginx_ingress_controller_requests{status=~\"5..\"}[6h])) or vector(0)) / (sum(rate(nginx_ingress_controller_requests[6h])) or vector(1))) / 0.001",
              "legendFormat": "6h Burn Rate (Warning > 6x)",
              "refId": "B"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 400,
          "title": "E-Commerce Funnel & Business Operational Metrics",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisGridShow": true, "fillOpacity": 20, "lineWidth": 2 },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "id": 11,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "E-Commerce User Journey Funnel",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{status=\"200\",method=\"GET\"}[1m]))",
              "legendFormat": "1. Catalog Browsing (req/s)",
              "refId": "A"
            },
            {
              "expr": "rate(inventory_active_holds[1m]) * 60",
              "legendFormat": "2. In-Flight Cart Additions (/min)",
              "refId": "B"
            },
            {
              "expr": "sum(rate(nginx_ingress_controller_requests{method=\"POST\"}[1m]))",
              "legendFormat": "3. Checkout Initiated (req/s)",
              "refId": "C"
            },
            {
              "expr": "sum(rate(inventory_reservations_total{result=\"ok\"}[1m])) * 60",
              "legendFormat": "4. Order Placed (/min)",
              "refId": "D"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": { "axisCenteredZero": false, "axisGridShow": true, "fillOpacity": 20, "lineWidth": 2 },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "id": 12,
          "options": {
            "legend": { "calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "title": "Data Tier Performance (Redis Cache & Inventory DB)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(productcatalog_cache_hits_total[1m]))",
              "legendFormat": "Redis Cache Hits (ops/s)",
              "refId": "A"
            },
            {
              "expr": "sum(rate(productcatalog_cache_misses_total[1m]))",
              "legendFormat": "Redis Cache Misses (ops/s)",
              "refId": "B"
            },
            {
              "expr": "inventory_active_holds",
              "legendFormat": "Inventory Active Holds",
              "refId": "C"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["online-boutique", "slo", "ecommerce", "sre"],
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": { "refresh_intervals": ["5s", "10s", "30s", "1m"] },
      "timezone": "browser",
      "title": "Online Boutique — E-Commerce Golden Signals & SLOs",
      "uid": "online-boutique-golden-signals"
    }
