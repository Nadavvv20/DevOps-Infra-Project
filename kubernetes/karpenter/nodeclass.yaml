apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: KarpenterNodeRole-{{CLUSTER_NAME}}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{CLUSTER_NAME}}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{CLUSTER_NAME}}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    karpenter.sh/discovery: {{CLUSTER_NAME}}
    Environment: {{ENVIRONMENT}}
    Project: online-boutique
    ManagedBy: Karpenter
