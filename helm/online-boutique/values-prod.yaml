# =========================================================
# Production environment overrides
# =========================================================

onlineboutique:
  loadgenerator:
    enabled: false

  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

  frontend:
    replicaCount: 3
    podDisruptionBudget:
      enabled: true
      minAvailable: 2

  checkoutservice:
    replicaCount: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1

  productcatalogservice:
    replicaCount: 2

  # Horizontal Pod Autoscaler
  hpa:
    frontend:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilizationPercentage: 60
    checkoutservice:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
